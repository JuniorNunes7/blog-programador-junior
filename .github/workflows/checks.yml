name: Checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
      markdown: ${{ steps.changes.outputs.markdown }}
      articles: ${{ steps.changes.outputs.articles }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node bin/pr-changes.mjs "$PR_BASE" "$PR_HEAD"
  php:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
      - run: composer lint
      - run: composer build
      - run: sudo apt-get update && sudo apt-get install -y apache2
      - run: composer test:apache
  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build:assets
      - run: npm run test:front:container
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  markdown:
    needs: [changes, php, frontend]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.markdown == 'true' &&
          (needs.php.result == 'success' || needs.php.result == 'skipped') &&
          (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    uses: ./.github/workflows/markdown.yml
    with:
      articles: ${{ needs.changes.outputs.articles == 'true' }}
