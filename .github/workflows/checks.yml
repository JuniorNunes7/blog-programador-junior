name: Checks and deploy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
      - run: composer lint
      - run: composer build
      - run: composer build
      - run: sudo apt-get update && sudo apt-get install -y apache2
      - run: composer test:apache
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build:assets
      - run: npm run test:front:container
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [php, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare production environment
        run: cp .env.example .env
      - run: composer build
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync dist to production
        env:
          SSH_TARGET: junior@juniornunes.dev
          DEPLOY_DIR: /home/junior/blog.juniornunes.dev
        run: |
          rsync --archive --compress --delete-delay --delay-updates \
            dist/ "$SSH_TARGET:$DEPLOY_DIR/"
